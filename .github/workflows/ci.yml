name: ci

on:
  pull_request:
  push:
    branches: [main, architecture/implementation-readiness]

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate Terraform configuration
        working-directory: infra/terraform
        run: terraform init -backend=false && terraform validate
      - name: Build API image
        run: docker build --file apps/api/Dockerfile --tag aios-api:${{ github.sha }} .
      - name: Build Worker image
        run: docker build --file apps/worker/Dockerfile --tag aios-worker:${{ github.sha }} .

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://aios_test:test_only@localhost:5432/aios_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aios_test
          POSTGRES_USER: aios_test
          POSTGRES_PASSWORD: test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aios_test -d aios_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - name: Apply M1 database baseline
        run: for migration in db/migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"; done
      - name: Verify M1 database invariants
        run: psql "$DATABASE_URL" -f db/tests/m1_invariants.sql
      - name: Verify M2 Work invariants
        run: psql "$DATABASE_URL" -f db/tests/m2_work_invariants.sql
      - name: Verify M3 Decision and Completion Gate invariants
        run: psql "$DATABASE_URL" -f db/tests/m3_decision_invariants.sql
      - name: Verify M4 Memory generation and review invariants
        run: psql "$DATABASE_URL" -f db/tests/m4_memory_invariants.sql
      - name: Verify M5 operational recovery invariants
        run: psql "$DATABASE_URL" -f db/tests/m5_operational_invariants.sql
      - name: Verify M6 production approval invariants
        run: psql "$DATABASE_URL" -f db/tests/m6_production_gate_invariants.sql
      - name: Record reviewed schema fingerprint
        run: |
          psql "$DATABASE_URL" -Atc "SELECT md5(string_agg(definition, E'\\n' ORDER BY definition)) FROM (SELECT table_name||':'||ordinal_position||':'||column_name||':'||data_type||':'||is_nullable AS definition FROM information_schema.columns WHERE table_schema='public' UNION ALL SELECT conrelid::regclass::text||':'||conname||':'||pg_get_constraintdef(oid,true) FROM pg_constraint WHERE connamespace='public'::regnamespace) schema_contract" | tee m1-schema-fingerprint.txt
      - run: pnpm verify
        env:
          NODE_ENV: test
          AIOS_API_PORT: '3001'
          AIOS_WORKER_ROLES: outbox-publisher,local-consumer,memory-generation,lease-recovery
          CLERK_ISSUER_URL: https://test.clerk.accounts.dev
          OPENAI_API_KEY_REF: test-reference
