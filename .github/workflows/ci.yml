name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # The tests and the dev server read TypeScript source; a deployed process
      # reads `dist` with plain `node`, and for a while it could not — workspace
      # packages exported only their source, which `node` cannot load. Nothing
      # in a source-reading suite can catch that, so load the built graph the
      # way a container does.
      #
      # `app.js` rather than `main.js`, because importing it resolves every
      # workspace package without binding a port. The other two are run as the
      # images run them, with `DATABASE_URL` deliberately unset: reaching their
      # own complaint about it is proof the module graph loaded, where a broken
      # export map would fail with ERR_MODULE_NOT_FOUND instead and the grep
      # would not match.
      - name: Built entry points resolve under plain node
        working-directory: apps/api
        run: |
          node --input-type=module -e 'await import("./dist/app.js")'
          node dist/worker.js  2>&1 | grep -q 'DATABASE_URL is required'
          node dist/migrate.js 2>&1 | grep -q 'DATABASE_URL is not set'

  schema:
    name: Documented schema applies to PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The persistence and events documents are the authoritative schema.
      # Applying them to a real database keeps "conceptual DDL" honest.
      - name: Extract schema from documentation
        run: python3 scripts/extract_schema.py

      - name: Apply schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f build/schema.sql

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The command deployment actually invokes (ADR-0020), against a database
      # the migration chain has never seen. The equivalence check that proves the
      # chain still reproduces the documents runs with the tests below; this
      # proves the entry point itself works and is idempotent.
      - name: Migrate a fresh database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migrate_check
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres migrate_check
          pnpm --filter @aios/api migrate
          pnpm --filter @aios/api migrate -- --status

      # Repository and HTTP tests run against the documented schema, not a
      # hand-written fixture, so a schema change that breaks a query fails here.
      - name: Database-backed tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pnpm --filter @aios/persistence --filter @aios/api test

  restore-drill:
    name: Point-in-time recovery drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The baseline requires "a documented isolated restore test at least
      # monthly", and the architecture says why a backup job's exit code is not
      # one: "Backup-job success is not proof of recoverability." This restores
      # to a chosen instant and asserts the instant was honoured — rows after
      # the target must be absent, which is the half that distinguishes a real
      # PITR from a replay of everything.
      #
      # It builds its own throwaway cluster, so it needs no service container
      # and disturbs nothing.
      - name: Restore drill
        run: sudo ./scripts/restore_drill.sh

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile was written and never built — the container this
      # repository was developed in cannot reach a registry, so `docker build`
      # has never run against it. That is the single riskiest untested artifact
      # here, because every deployment path starts with it and the first attempt
      # would otherwise happen on the day AWS is also new.
      #
      # Two targets, because the Worker is its own process (baseline item 13)
      # and `chooseWorkerMode` refuses to drain in-process outside development.
      - name: Build the API image
        run: docker build --target api --tag aios-api:ci .

      - name: Build the Worker image
        run: docker build --target worker --tag aios-worker:ci .

      # A built image that cannot start is a built image. `CMD` is
      # `node dist/main.js` rather than a pnpm wrapper on purpose — a wrapper at
      # PID 1 swallows SIGTERM, and the Worker's graceful drain depends on
      # receiving it — and production resolves the workspace packages to `dist`
      # while development resolves them to `src`. Only a real container
      # exercises that resolution.
      - name: The API image starts and reports a reason it cannot serve
        run: |
          set -o pipefail
          # No DATABASE_URL, so it must fail fast and say so rather than hang.
          output=$(docker run --rm aios-api:ci 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "DATABASE_URL is required"

      - name: The Worker image starts and reports the same
        run: |
          set -o pipefail
          output=$(docker run --rm aios-worker:ci 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "DATABASE_URL is required"
