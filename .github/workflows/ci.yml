name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # The tests and the dev server read TypeScript source; a deployed process
      # reads `dist` with plain `node`, and for a while it could not — workspace
      # packages exported only their source, which `node` cannot load. Nothing
      # in a source-reading suite can catch that, so load the built graph the
      # way a container does.
      #
      # `app.js` rather than `main.js`, because importing it resolves every
      # workspace package without binding a port. The other two are run as the
      # images run them, with `DATABASE_URL` deliberately unset: reaching their
      # own complaint about it is proof the module graph loaded, where a broken
      # export map would fail with ERR_MODULE_NOT_FOUND instead and the grep
      # would not match.
      - name: Built entry points resolve under plain node
        working-directory: apps/api
        run: |
          node --input-type=module -e 'await import("./dist/app.js")'
          node dist/worker.js  2>&1 | grep -q 'DATABASE_URL is required'
          node dist/migrate.js 2>&1 | grep -q 'DATABASE_URL is not set'

  schema:
    name: Documented schema applies to PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The persistence and events documents are the authoritative schema.
      # Applying them to a real database keeps "conceptual DDL" honest.
      - name: Extract schema from documentation
        run: python3 scripts/extract_schema.py

      - name: Apply schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f build/schema.sql

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The command deployment actually invokes (ADR-0020), against a database
      # the migration chain has never seen. The equivalence check that proves the
      # chain still reproduces the documents runs with the tests below; this
      # proves the entry point itself works and is idempotent.
      - name: Migrate a fresh database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migrate_check
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres migrate_check
          pnpm --filter @aios/api migrate
          pnpm --filter @aios/api migrate -- --status

      # Repository and HTTP tests run against the documented schema, not a
      # hand-written fixture, so a schema change that breaks a query fails here.
      - name: Database-backed tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pnpm --filter @aios/persistence --filter @aios/api test
