name: Docs

on:
  push:
    # Same reason as `ci.yml`: restricted to `main`, none of the three checks
    # below ran on a working branch, so the drift they exist to catch could
    # accumulate for as long as the branch lived.
    branches: [main, "claude/**"]
  pull_request:

jobs:
  check:
    name: Documentation structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check documentation structure
        run: python3 scripts/check_docs.py

      - name: Check routed permissions are enforced
        run: python3 scripts/check_routes.py

      - name: Check the authorization audit records what it claims to
        run: python3 scripts/check_audit.py
