name: Docs

on:
  push:
    # Same reason as `ci.yml`: restricted to `main`, none of the three checks
    # below ran on a working branch, so the drift they exist to catch could
    # accumulate for as long as the branch lived.
    branches: [main, "claude/**"]
  pull_request:

jobs:
  check:
    name: Documentation structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check documentation structure
        run: python3 scripts/check_docs.py

      - name: Check routed permissions are enforced
        run: python3 scripts/check_routes.py

      - name: Check the authorization audit records what it claims to
        run: python3 scripts/check_audit.py

      # The templates in `infra/` have never been applied and cannot be from
      # here. What is checkable is that they still agree with the code they
      # describe — an alarm threshold against the constant in `recovery.ts`, a
      # probe path against what the process actually serves, a log retention
      # against ADR-0003's table. Those drift silently, because nobody re-reads
      # a CloudFormation template when they change a TypeScript constant.
      - name: Check the infrastructure agrees with the code
        run: |
          pip install --quiet pyyaml
          python3 scripts/check_infra.py

      # Two different questions, and both are worth asking. `check_infra.py`
      # asks whether the templates are right about *this application*; cfn-lint
      # asks whether they are valid CloudFormation at all. Neither answers the
      # other, and cfn-lint found four stateful resources with no deletion
      # policy — including the KMS key that the retained database and the
      # retained evidence bucket are both encrypted with.
      #
      # Informational and experimental rules included deliberately: the finding
      # above was an `I` rule, and running only the errors would have missed it.
      - name: Lint the CloudFormation templates
        run: |
          pip install --quiet cfn-lint
          cfn-lint --include-checks I --include-experimental infra/*.yaml
